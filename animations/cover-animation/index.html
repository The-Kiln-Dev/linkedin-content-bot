<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #FFFFFF;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      /* Scene-content fills the canvas. Padding positions content. */
      .scene-content {
        width: 100%;
        height: 100%;
        padding: 72px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        box-sizing: border-box;
        position: relative;
      }

      /* Top bar — lockup left, Patrick badge right */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .lockup {
        height: 52px;
        width: auto;
        display: block;
      }

      .badge {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .badge img {
        width: 56px;
        height: 56px;
        border-radius: 12px;
        object-fit: cover;
        display: block;
      }

      .badge .name {
        font-weight: 700;
        font-size: 22px;
        color: #000000;
        letter-spacing: -0.01em;
      }

      /* Center hero stack */
      .hero-stack {
        margin-top: 88px;
        display: flex;
        flex-direction: column;
        gap: 28px;
        max-width: 100%;
      }

      .category {
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #000000;
      }

      .headline {
        font-weight: 800;
        font-size: 88px;
        line-height: 0.98;
        letter-spacing: -0.03em;
        color: #000000;
        max-width: 100%;
      }

      .headline .line {
        display: block;
      }

      .cta-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: #000000;
        color: #FFFFFF;
        padding: 20px 34px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 26px;
        letter-spacing: -0.01em;
        align-self: flex-start;
        margin-top: 12px;
      }

      /* Editorial rule below the category label — a single quiet ink mark.
         Replaces the prior flanking doodle + 3D icon decoratives. */
      .rule {
        width: 96px;
        height: 3px;
        background: #000000;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="5"
      data-width="1080"
      data-height="1350"
    >
      <div class="scene-content">
        <div class="top-bar">
          <img class="lockup clip" id="lockup"
               src="kiln-lockup.png" alt="The Kiln"
               data-start="0" data-duration="5" data-track-index="1" />
          <div class="badge clip" id="badge"
               data-start="0" data-duration="5" data-track-index="2">
            <span class="name">Patrick</span>
            <img src="patrick.jpeg" alt="Patrick" />
          </div>
        </div>

        <div class="hero-stack">
          <div class="category clip" id="category"
               data-start="0" data-duration="5" data-track-index="3">HOT TAKE</div>
          <div class="rule clip" id="rule"
               data-start="0" data-duration="5" data-track-index="4"></div>
          <h1 class="headline">
            <span class="line clip" id="line1"
                  data-start="0" data-duration="5" data-track-index="5">Will Claude Code</span>
            <span class="line clip" id="line2"
                  data-start="0" data-duration="5" data-track-index="6">replace Clay?</span>
          </h1>
          <div class="cta-pill clip" id="cta"
               data-start="0" data-duration="5" data-track-index="7">Read more →</div>
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Editorial entrance — opacity + tiny vertical translates only.
      // No scale, no rotation, no overshoot. Smooth power eases.
      tl.from("#lockup",   { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.2);
      tl.from("#badge",    { opacity: 0, duration: 0.7, ease: "power2.out" }, 0.35);

      // Category + rule — small slide-up, quiet
      tl.from("#category", { y: 12, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.7);
      tl.from("#rule",     { scaleX: 0, transformOrigin: "left center", opacity: 0, duration: 0.7, ease: "power3.out" }, 0.85);

      // Headline — line-by-line, gentle reveal (24px, not 60px), no overshoot
      tl.from("#line1",    { y: 24, opacity: 0, duration: 0.8, ease: "power3.out" }, 1.0);
      tl.from("#line2",    { y: 24, opacity: 0, duration: 0.8, ease: "power3.out" }, 1.18);

      // CTA pill — fade + tiny slide-up, no scale
      tl.from("#cta",      { y: 16, opacity: 0, duration: 0.7, ease: "power3.out" }, 1.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
