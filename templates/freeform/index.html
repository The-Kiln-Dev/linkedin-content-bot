<!doctype html>
<html lang="en" data-resolution="custom-1080x1350">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,30..100;1,9..144,400..700,30..100&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #000;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      :root {
        --grad-from: #FB923C;
        --grad-to:   #818CF8;
        --ink:       #0a0a0a;
        --cream:     #F5F4EB;
        --white:     #FFFFFF;
        --muted:     #6e685e;
        --muted-2:   #9c958a;
        --rule:      rgba(0,0,0,0.1);
        --rule-soft: rgba(0,0,0,0.06);
        --accent:    #FB923C;
        --indigo:    #4F46E5;
        --frame:     50px;
      }

      /* Outer gradient frame */
      .frame {
        width: 1080px;
        height: 1350px;
        position: relative;
        background: linear-gradient(135deg, var(--grad-from) 0%, var(--grad-to) 100%);
        padding: var(--frame);
        overflow: hidden;
      }
      .frame::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url('assets/texture-topographic.png');
        background-size: 50% 50%;
        background-repeat: repeat;
        mix-blend-mode: multiply;
        opacity: 0.5;
        pointer-events: none;
        z-index: 1;
      }

      .interior {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        background: var(--cream);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 32px 44px 26px;
      }

      /* Top bar — Kiln lockup only (no chrome) */
      .top-bar {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        flex: 0 0 auto;
      }
      .kiln-lockup { height: 36px; width: auto; }

      /* Title */
      .title-block {
        margin-top: 20px;
        flex: 0 0 auto;
      }
      .post-title {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 500;
        font-variation-settings: "SOFT" 80, "opsz" 96;
        font-size: 56px;
        line-height: 1.02;
        letter-spacing: -0.018em;
        color: var(--ink);
      }
      .post-title .emph {
        font-style: italic;
        color: var(--accent);
      }
      .post-sub {
        font-family: 'Inter', sans-serif;
        font-size: 17px;
        line-height: 1.45;
        color: var(--muted);
        margin-top: 12px;
        max-width: 820px;
      }

      /* Diagram stage — fills remaining height */
      .stage {
        flex: 1 1 auto;
        margin-top: 18px;
        min-height: 0;
        position: relative;
        display: flex;
        align-items: stretch;
      }
      .stage-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* Footer */
      .footer-rule {
        height: 1px;
        background: var(--rule);
        margin-top: 14px;
        flex: 0 0 auto;
      }
      .footer {
        padding-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Inter', sans-serif;
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
        flex: 0 0 auto;
      }
      .footer .author { display: flex; align-items: center; gap: 10px; }
      .author-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
      .footer .url { font-weight: 600; color: var(--ink); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1080"
      data-height="1350"
    >
      <div class="frame">
        <div class="interior">

          <!-- Top bar -->
          <div class="top-bar">
            <img class="kiln-lockup" src="assets/kiln-lockup-black.png" alt="The Kiln">
          </div>

          <!-- Title -->
          <div class="title-block">
            <h1 class="post-title">Notion just became the<br>agent <em class="emph">control plane</em></h1>
            <p class="post-sub">External agents on one side. Database sync on the other. All inside the workspace your team already lives in.</p>
          </div>

          <!-- Stage: hub-and-spoke diagram.
               Polar coordinate geometry: hub at (cx=490, cy=480), ring radius R=290.
               6 nodes at angles starting from top (-90°), 60° apart clockwise:
                 Top         θ=-90°  (Claude Code)        → (490, 190)
                 Top-Right   θ=-30°  (Cursor)             → (741, 335)
                 Bot-Right   θ= 30°  (Salesforce)         → (741, 625)
                 Bottom      θ= 90°  (Postgres)           → (490, 770)
                 Bot-Left    θ=150°  (Decagon)            → (239, 625)
                 Top-Left    θ=210°  (Codex)              → (239, 335)
               Spoke colors:
                 External Agents (Claude, Cursor, Codex, Decagon) → peach
                 Database Sync   (Salesforce, Postgres)           → indigo -->
          <div class="stage">
            <svg class="stage-svg" viewBox="0 0 980 940" preserveAspectRatio="xMidYMid meet">

              <defs>
                <!-- Soft glow under the hub -->
                <radialGradient id="hub-glow" cx="0.5" cy="0.5" r="0.5">
                  <stop offset="0%" stop-color="#FB923C" stop-opacity="0.12"/>
                  <stop offset="60%" stop-color="#FB923C" stop-opacity="0.04"/>
                  <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
                </radialGradient>
              </defs>

              <!-- Soft glow behind hub -->
              <circle cx="490" cy="480" r="240" fill="url(#hub-glow)"/>

              <!-- Ring guide (very subtle dashed circle at the spoke endpoint radius) -->
              <circle cx="490" cy="480" r="290" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-dasharray="2 6"/>

              <!-- Section header labels — category names only, no directional suffixes (they were misleading) -->
              <text x="490" y="68" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="var(--accent)" letter-spacing="2.4">EXTERNAL AGENTS API</text>
              <text x="490" y="902" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="var(--indigo)" letter-spacing="2.4">DATABASE SYNC</text>

              <!-- ============ Spokes ============
                   Each spoke: from inner radius 75 (just outside hub) to outer radius 245 (just inside ring node).
                   Peach spokes for agents, indigo for DB sync. -->

              <!-- Top (Claude) — agent, peach -->
              <line x1="490" y1="405" x2="490" y2="235" stroke="#FB923C" stroke-width="3.5" stroke-linecap="round"/>
              <!-- Top-Right (Cursor) — agent, peach -->
              <line x1="555" y1="442.5" x2="702" y2="357.5" stroke="#FB923C" stroke-width="3.5" stroke-linecap="round"/>
              <!-- Bot-Right (Salesforce) — DB, indigo -->
              <line x1="555" y1="517.5" x2="702" y2="602.5" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round"/>
              <!-- Bottom (Postgres) — DB, indigo -->
              <line x1="490" y1="555" x2="490" y2="725" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round"/>
              <!-- Bot-Left (Decagon) — agent, peach -->
              <line x1="425" y1="517.5" x2="278" y2="602.5" stroke="#FB923C" stroke-width="3.5" stroke-linecap="round"/>
              <!-- Top-Left (Codex) — agent, peach -->
              <line x1="425" y1="442.5" x2="278" y2="357.5" stroke="#FB923C" stroke-width="3.5" stroke-linecap="round"/>

              <!-- Small data-flow dots on each spoke (visual interest, suggests "data flows") -->
              <g fill="#FB923C">
                <circle cx="490" cy="320" r="3"/>
                <circle cx="628.5" cy="400" r="3"/>
                <circle cx="351.5" cy="480" r="3" fill="#FB923C"/>
                <circle cx="351.5" cy="400" r="3"/>
              </g>
              <g fill="#4F46E5">
                <circle cx="628.5" cy="560" r="3"/>
                <circle cx="490" cy="640" r="3"/>
              </g>

              <!-- ============ Hub: Notion (the center) ============ -->
              <!-- Hub backing circle (slightly larger ring for depth) -->
              <circle cx="490" cy="480" r="78" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
              <circle cx="490" cy="480" r="78" fill="none" stroke="rgba(251,146,60,0.35)" stroke-width="2" stroke-dasharray="3 5"/>
              <!-- Notion logo, centered at (490, 480), 110x110 -->
              <image href="assets/logos/notion-icon.png" x="435" y="425" width="110" height="110"/>

              <!-- Hub label (below the circle) -->
              <text x="490" y="588" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="var(--ink)" letter-spacing="2.2">NOTION</text>
              <text x="490" y="604" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="700" fill="var(--accent)" letter-spacing="2">THE CONTROL PLANE</text>

              <!-- ============ Ring nodes ============
                   Each: white backing circle (r=44) + logo (80x80, centered) + label radial-outward. -->

              <!-- Top: Claude Code at (490, 190) -->
              <circle cx="490" cy="190" r="44" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
              <image href="assets/logos/anthropic-icon.png" x="450" y="150" width="80" height="80"/>
              <text x="490" y="118" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Claude Code</text>
              <text x="490" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="var(--accent)" letter-spacing="1.6">EXTERNAL AGENT</text>

              <!-- Top-Right: Cursor at (741, 335) -->
              <circle cx="741" cy="335" r="44" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
              <image href="assets/logos/cursor-icon.png" x="701" y="295" width="80" height="80"/>
              <text x="800" y="318" text-anchor="start" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Cursor</text>
              <text x="800" y="334" text-anchor="start" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="var(--accent)" letter-spacing="1.6">EXTERNAL AGENT</text>

              <!-- Bot-Right: Salesforce at (741, 625) -->
              <circle cx="741" cy="625" r="44" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
              <image href="assets/logos/salesforce-icon.png" x="701" y="585" width="80" height="80"/>
              <text x="800" y="635" text-anchor="start" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Salesforce</text>
              <text x="800" y="651" text-anchor="start" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="var(--indigo)" letter-spacing="1.6">DATABASE SYNC</text>

              <!-- Bottom: Postgres at (490, 770) -->
              <circle cx="490" cy="770" r="44" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
              <image href="assets/logos/postgres-icon.svg" x="450" y="730" width="80" height="80"/>
              <text x="490" y="844" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Postgres</text>
              <text x="490" y="860" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="var(--indigo)" letter-spacing="1.6">DATABASE SYNC</text>

              <!-- Bot-Left: Decagon at (239, 625) -->
              <circle cx="239" cy="625" r="44" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
              <image href="assets/logos/decagon-icon.png" x="199" y="585" width="80" height="80"/>
              <text x="180" y="635" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Decagon</text>
              <text x="180" y="651" text-anchor="end" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="var(--accent)" letter-spacing="1.6">EXTERNAL AGENT</text>

              <!-- Top-Left: Codex at (239, 335) -->
              <circle cx="239" cy="335" r="44" fill="#FFFFFF" stroke="rgba(0,0,0,0.1)" stroke-width="1.5"/>
              <image href="assets/logos/openai-icon.png" x="199" y="295" width="80" height="80"/>
              <text x="180" y="318" text-anchor="end" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="var(--ink)">Codex</text>
              <text x="180" y="334" text-anchor="end" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="var(--accent)" letter-spacing="1.6">EXTERNAL AGENT</text>

            </svg>
          </div>

          <!-- Footer -->
          <div class="footer-rule"></div>
          <div class="footer">
            <div class="author">
              <span class="author-dot"></span>
              <span>Patrick Spychalski</span>
            </div>
            <span class="url">thekiln.com</span>
          </div>

        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
