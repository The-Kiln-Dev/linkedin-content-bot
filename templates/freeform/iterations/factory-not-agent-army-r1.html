<!doctype html>
<html lang="en" data-resolution="custom-1080x1350">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/layout.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,30..100;1,9..144,400..700,30..100&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #000;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      :root {
        --grad-from: #FB923C;
        --grad-to:   #818CF8;
        --ink:       #0a0a0a;
        --cream:     #F5F4EB;
        --white:     #FFFFFF;
        --muted:     #6e685e;
        --rule:      rgba(0,0,0,0.1);
        --accent:    #FB923C;
        --indigo:    #4F46E5;
        --frame:     50px;
      }

      .frame {
        width: 1080px;
        height: 1350px;
        position: relative;
        background: linear-gradient(135deg, var(--grad-from) 0%, var(--grad-to) 100%);
        padding: var(--frame);
        overflow: hidden;
      }
      .frame::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url('assets/texture-topographic.png');
        background-size: 50% 50%;
        background-repeat: repeat;
        mix-blend-mode: multiply;
        opacity: 0.5;
        pointer-events: none;
        z-index: 1;
      }

      .interior {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        background: var(--cream);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 32px 44px 26px;
      }

      .top-bar { display: flex; justify-content: flex-start; align-items: center; flex: 0 0 auto; }
      .kiln-lockup { height: 36px; width: auto; }

      .title-block { margin-top: 20px; flex: 0 0 auto; }
      .post-title {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 500;
        font-variation-settings: "SOFT" 80, "opsz" 96;
        font-size: 54px;
        line-height: 1.02;
        letter-spacing: -0.018em;
        color: var(--ink);
      }
      .post-title .emph { font-style: italic; color: var(--accent); }
      .post-sub {
        font-family: 'Inter', sans-serif;
        font-size: 17px;
        line-height: 1.45;
        color: var(--muted);
        margin-top: 12px;
        max-width: 820px;
      }

      .stage {
        flex: 1 1 auto;
        margin-top: 14px;
        min-height: 0;
        position: relative;
        display: flex;
        align-items: stretch;
      }
      .stage-svg { width: 100%; height: 100%; display: block; }

      .footer-rule { height: 1px; background: var(--rule); margin-top: 14px; flex: 0 0 auto; }
      .footer {
        padding-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Inter', sans-serif;
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
        flex: 0 0 auto;
      }
      .footer .author { display: flex; align-items: center; gap: 10px; }
      .author-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
      .footer .url { font-weight: 600; color: var(--ink); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1080"
      data-height="1350"
    >
      <div class="frame">
        <div class="interior">

          <!-- Top bar -->
          <div class="top-bar">
            <img class="kiln-lockup" src="assets/kiln-lockup-black.png" alt="The Kiln">
          </div>

          <!-- Title -->
          <div class="title-block">
            <h1 class="post-title">Build a <em class="emph">factory</em>,<br>not an army of agents.</h1>
            <p class="post-sub">Most workflows don't need judgment. They need a rubric. Use the agent for the long tail, use the deterministic line for the rest.</p>
          </div>

          <!-- Stage: two production lines (agentic over deterministic).
               viewBox 980 x 920 matches the available container aspect.
               All elements are anchored to SVG coordinates. Rectangles only,
               so direct coordinates work without the layout library. -->
          <div class="stage">
            <svg id="stage" class="stage-svg" viewBox="0 0 980 920" preserveAspectRatio="xMidYMid meet">

              <defs>
                <!-- Subtle tinted backgrounds for each band -->
                <linearGradient id="agentic-band" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#FB923C" stop-opacity="0.04"/>
                  <stop offset="100%" stop-color="#FB923C" stop-opacity="0.10"/>
                </linearGradient>
                <linearGradient id="det-band" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.04"/>
                  <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.10"/>
                </linearGradient>

                <!-- Arrowhead markers for the rail direction indicators -->
                <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#FB923C"/>
                </marker>
                <marker id="arrow-indigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                  <path d="M 0 0 L 10 5 L 0 10 z" fill="#4F46E5"/>
                </marker>
              </defs>

              <!-- ============================================ -->
              <!-- AGENTIC LINE  (y range 20-420)               -->
              <!-- ============================================ -->

              <!-- Band background -->
              <rect x="0" y="20" width="980" height="400" fill="url(#agentic-band)" rx="10"/>

              <!-- Band label (top-left) -->
              <text x="40" y="70" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#FB923C" letter-spacing="2.6">AGENTIC LINE</text>

              <!-- Concrete example (the post mentions LinkedIn description scoring) -->
              <text x="40" y="115" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="500" font-size="24" fill="#0a0a0a">"Score this company by its LinkedIn description."</text>

              <!-- Descriptor under the example -->
              <text x="40" y="148" font-family="Inter, sans-serif" font-size="14.5" font-weight="500" fill="#6e685e">Needs nuanced judgment. Only an LLM does this well.</text>

              <!-- Track rail (rounded rect spanning most of the width) -->
              <rect x="80" y="225" width="730" height="40" rx="20" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.5" stroke-opacity="0.45"/>

              <!-- Direction arrow above the rail -->
              <line x1="100" y1="200" x2="790" y2="200" stroke="#FB923C" stroke-width="1.4" stroke-opacity="0.5" marker-end="url(#arrow-orange)"/>

              <!-- LLM chip (above the single item) -->
              <rect x="395" y="170" width="120" height="28" rx="14" fill="#0a0a0a"/>
              <text x="455" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#FB923C" letter-spacing="2.0">LLM JUDGES</text>

              <!-- Dotted indicator line from chip to item -->
              <line x1="455" y1="200" x2="455" y2="227" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

              <!-- Single LARGE item on the agentic rail (the post's central insight: agentic moves one thing at a time) -->
              <rect x="395" y="215" width="120" height="60" rx="8" fill="#FB923C" stroke="#B45309" stroke-width="2"/>
              <text x="455" y="250" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">1 item</text>

              <!-- Under-rail caption (left) -->
              <text x="80" y="320" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0a0a0a" letter-spacing="1.4">SLOW · EXPENSIVE · NUANCED</text>

              <!-- Big right-side scale indicator -->
              <text x="940" y="240" text-anchor="end" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="500" font-size="78" fill="#FB923C">×1</text>
              <text x="940" y="275" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#6e685e" letter-spacing="1.6">IN FLIGHT</text>

              <!-- Cost callout -->
              <text x="80" y="370" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#6e685e">Per task:</text>
              <text x="156" y="370" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#FB923C">$$$ &nbsp;(token-priced, scales linearly with volume)</text>

              <!-- ============================================ -->
              <!-- DIVIDER ZONE  (y range 420-500)              -->
              <!-- ============================================ -->

              <!-- Subtle separator line with a small center pip -->
              <line x1="40" y1="460" x2="460" y2="460" stroke="#0a0a0a" stroke-opacity="0.12" stroke-width="1"/>
              <line x1="520" y1="460" x2="940" y2="460" stroke="#0a0a0a" stroke-opacity="0.12" stroke-width="1"/>
              <text x="490" y="465" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#6e685e" letter-spacing="2.0">SAME WORKFLOW</text>

              <!-- ============================================ -->
              <!-- DETERMINISTIC LINE  (y range 500-900)        -->
              <!-- ============================================ -->

              <!-- Band background -->
              <rect x="0" y="500" width="980" height="400" fill="url(#det-band)" rx="10"/>

              <!-- Band label (top-left) -->
              <text x="40" y="550" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#4F46E5" letter-spacing="2.6">DETERMINISTIC LINE</text>

              <!-- Concrete example (the post's rubric example) -->
              <text x="40" y="595" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="500" font-size="24" fill="#0a0a0a">"If revenue &gt; $100M and industry is software → score X."</text>

              <!-- Descriptor under the example -->
              <text x="40" y="628" font-family="Inter, sans-serif" font-size="14.5" font-weight="500" fill="#6e685e">Follows a fixed rubric. Build it once in n8n or have Claude write the code.</text>

              <!-- Track rail (matching width of the agentic rail) -->
              <rect x="80" y="705" width="730" height="40" rx="20" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.5" stroke-opacity="0.45"/>

              <!-- Direction arrow above the rail -->
              <line x1="100" y1="680" x2="790" y2="680" stroke="#4F46E5" stroke-width="1.4" stroke-opacity="0.5" marker-end="url(#arrow-indigo)"/>

              <!-- RULE chip (above the row of items) -->
              <rect x="395" y="650" width="120" height="28" rx="14" fill="#0a0a0a"/>
              <text x="455" y="669" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#4F46E5" letter-spacing="2.4">RULE APPLIES</text>

              <!-- Dotted indicator line from chip to row -->
              <line x1="455" y1="680" x2="455" y2="707" stroke="#0a0a0a" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>

              <!-- MANY small items on the deterministic rail.
                   18 items spaced evenly across the 730px rail (from x=95 to x=795).
                   Each item is 24x32 — small relative to the agentic 120x60. -->
              <g transform="translate(0, 0)">
                <rect x="100"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="138"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="176"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="214"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="252"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="290"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="328"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="366"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="404"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="442"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="480"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="518"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="556"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="594"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="632"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="670"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="708"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
                <rect x="746"  y="710" width="24" height="30" rx="3" fill="#4F46E5" stroke="#312E81" stroke-width="1.2"/>
              </g>

              <!-- Under-rail caption (left) -->
              <text x="80" y="800" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0a0a0a" letter-spacing="1.4">FAST · CHEAP · MOST OF YOUR WORK</text>

              <!-- Big right-side scale indicator -->
              <text x="940" y="720" text-anchor="end" font-family="Fraunces, Georgia, serif" font-style="italic" font-weight="500" font-size="78" fill="#4F46E5">×100+</text>
              <text x="940" y="755" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#6e685e" letter-spacing="1.6">IN FLIGHT</text>

              <!-- Cost callout -->
              <text x="80" y="850" font-family="Inter, sans-serif" font-size="15" font-weight="500" fill="#6e685e">Per task:</text>
              <text x="156" y="850" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#4F46E5">~$0 &nbsp;(fixed code, flat cost regardless of volume)</text>

            </svg>
          </div>

          <!-- Footer -->
          <div class="footer-rule"></div>
          <div class="footer">
            <div class="author">
              <span class="author-dot"></span>
              <span>Patrick Spychalski</span>
            </div>
            <span class="url">thekiln.com</span>
          </div>

        </div>
      </div>
    </div>

    <script>
    (function () {
      'use strict';
      // Static card — empty paused timeline.
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    })();
    </script>
  </body>
</html>
