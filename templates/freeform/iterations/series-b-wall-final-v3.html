<!doctype html>
<html lang="en" data-resolution="custom-1080x1350">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,30..100;1,9..144,400..700,30..100&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        background: #000;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      :root {
        --grad-from: #FB923C;
        --grad-to:   #818CF8;
        --ink:       #0a0a0a;
        --ink-soft:  #2a2620;
        --cream:     #F5F4EB;
        --cream-2:   #EDE6D3;
        --white:     #FFFFFF;
        --muted:     #6e685e;
        --muted-2:   #9c958a;
        --rule:      rgba(0,0,0,0.1);
        --rule-soft: rgba(0,0,0,0.06);
        --frame:     50px;

        /* Two-line chart palette */
        --line-fail:    #B45309;   /* deeper orange - the line that fails */
        --line-survive: #4F46E5;   /* indigo - the line that survives */
      }

      /* Outer gradient frame */
      .frame {
        width: 1080px;
        height: 1350px;
        position: relative;
        background: linear-gradient(135deg, var(--grad-from) 0%, var(--grad-to) 100%);
        padding: var(--frame);
        overflow: hidden;
      }
      .frame::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url('assets/texture-topographic.png');
        background-size: 50% 50%;
        background-repeat: repeat;
        mix-blend-mode: multiply;
        opacity: 0.5;
        pointer-events: none;
        z-index: 1;
      }

      /* Cream interior */
      .interior {
        position: relative;
        z-index: 2;
        width: 100%;
        height: 100%;
        background: var(--cream);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        padding: 32px 44px 26px;
      }

      /* ============ Top bar ============ */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex: 0 0 auto;
      }
      .kiln-lockup { height: 36px; width: auto; }
      .meta-badge {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
        letter-spacing: 0.18em;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .meta-badge::before {
        content: '';
        width: 6px;
        height: 6px;
        background: var(--grad-from);
        border-radius: 50%;
      }

      /* ============ Title block ============ */
      .title-block {
        margin-top: 20px;
        flex: 0 0 auto;
      }
      .eyebrow {
        font-family: 'Inter', sans-serif;
        font-size: 11px;
        font-weight: 700;
        color: var(--grad-from);
        letter-spacing: 0.2em;
        text-transform: uppercase;
        margin-bottom: 10px;
      }
      .post-title {
        font-family: 'Fraunces', Georgia, serif;
        font-weight: 500;
        font-variation-settings: "SOFT" 80, "opsz" 96;
        font-size: 58px;
        line-height: 1.02;
        letter-spacing: -0.018em;
        color: var(--ink);
      }
      .post-title .emph {
        font-style: italic;
        color: var(--grad-from);
      }
      .post-sub {
        font-family: 'Inter', sans-serif;
        font-size: 17px;
        line-height: 1.45;
        color: var(--muted);
        margin-top: 12px;
        max-width: 820px;
      }

      /* ============ Chart stage ============
         The chart fills the entire available height between title and footer.
         The SVG viewBox is sized to match the container aspect ratio so the chart fills
         the card edge-to-edge horizontally with no letterboxing.
         Card content area is 892×~880px after title/footer; viewBox matches that aspect. */
      .chart-wrap {
        flex: 1 1 auto;
        margin-top: 18px;
        min-height: 0;
        position: relative;
        display: flex;
        align-items: stretch;
      }
      .chart-svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ============ Verdict ============ */
      .verdict {
        margin-top: 14px;
        padding: 16px 22px;
        background: var(--ink);
        color: var(--white);
        border-radius: 12px;
        font-family: 'Fraunces', Georgia, serif;
        font-style: italic;
        font-weight: 500;
        font-size: 18px;
        line-height: 1.35;
        flex: 0 0 auto;
      }
      .verdict .label {
        display: inline-block;
        font-family: 'Inter', sans-serif;
        font-style: normal;
        font-weight: 800;
        font-size: 10.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--grad-from);
        margin-right: 12px;
        vertical-align: middle;
      }

      /* ============ Footer ============ */
      .footer-rule {
        height: 1px;
        background: var(--rule);
        margin-top: 14px;
        flex: 0 0 auto;
      }
      .footer {
        padding-top: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: 'Inter', sans-serif;
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
        flex: 0 0 auto;
      }
      .footer .author {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .author-dot {
        width: 8px;
        height: 8px;
        background: var(--grad-from);
        border-radius: 50%;
      }
      .footer .url { font-weight: 600; color: var(--ink); }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="1"
      data-width="1080"
      data-height="1350"
    >
      <div class="frame">
        <div class="interior">

          <!-- Top bar (Kiln lockup only — no meta chrome) -->
          <div class="top-bar">
            <img class="kiln-lockup" src="assets/kiln-lockup-black.png" alt="The Kiln">
          </div>

          <!-- Title -->
          <div class="title-block">
            <h1 class="post-title">AI-first CRMs hit a<br><em class="emph">Series B wall</em></h1>
            <p class="post-sub">What the new-wave CRMs nail at seed. What breaks when you actually need to scale.</p>
          </div>

          <!-- Chart: structured SVG.
               viewBox aspect ratio matches the now-larger chart area (after removing verdict + eyebrow).
               Plot area: 130 → 940 (810 wide), 130 → 760 (630 tall). All elements positioned via SVG coords. -->
          <div class="chart-wrap">
            <svg class="chart-svg" viewBox="0 0 980 880" preserveAspectRatio="xMidYMid meet">

              <defs>
                <linearGradient id="survive-fill" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%"  stop-color="#818CF8" stop-opacity="0.18"/>
                  <stop offset="100%" stop-color="#818CF8" stop-opacity="0.0"/>
                </linearGradient>
                <pattern id="wall-hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
                  <line x1="0" y1="0" x2="0" y2="6" stroke="#FB923C" stroke-width="3" stroke-opacity="0.22"/>
                </pattern>
              </defs>

              <!-- Plot area frame -->
              <rect x="130" y="130" width="810" height="630" fill="#FFFFFF" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>

              <!-- Horizontal gridlines (5 capability tiers, evenly spaced across plot height)
                   Tier 1 (bottom): y=760, Tier 5 (top): y=130. Spacing = (760-130)/4 = 157.5 -->
              <line x1="130" y1="760"   x2="940" y2="760"   stroke="rgba(0,0,0,0.1)"  stroke-width="1"/>
              <line x1="130" y1="602.5" x2="940" y2="602.5" stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-dasharray="2 4"/>
              <line x1="130" y1="445"   x2="940" y2="445"   stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-dasharray="2 4"/>
              <line x1="130" y1="287.5" x2="940" y2="287.5" stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-dasharray="2 4"/>
              <line x1="130" y1="130"   x2="940" y2="130"   stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-dasharray="2 4"/>

              <!-- Y-axis capability tier labels (right-aligned to x=120, vertically centered on each gridline) -->
              <g font-family="Inter, sans-serif" fill="#6e685e" text-anchor="end">
                <text x="120" y="764"   font-size="14" font-weight="600">Contacts + companies</text>
                <text x="120" y="606.5" font-size="14" font-weight="600">Sequences + workflows</text>
                <text x="120" y="449"   font-size="14" font-weight="600">Custom views + reports</text>
                <text x="120" y="291.5" font-size="14" font-weight="600">Hierarchy + custom objects</text>
                <text x="120" y="134"   font-size="14" font-weight="600">Routing + permissions</text>
              </g>

              <!-- Y-axis header (vertical, top-left of plot) -->
              <text x="130" y="115" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#9c958a" letter-spacing="2">CAPABILITY NEEDED ↑</text>

              <!-- ============ The Wall ============
                   Vertical band at the Series B tick (x=535) -->
              <rect x="525" y="130" width="20" height="305" fill="url(#wall-hatch)"/>
              <line x1="535" y1="130" x2="535" y2="445" stroke="#FB923C" stroke-width="2.5" stroke-dasharray="4 4"/>
              <line x1="535" y1="445" x2="535" y2="475" stroke="#FB923C" stroke-width="2.5"/>

              <!-- "SERIES B WALL" callout near the top of the wall band -->
              <g transform="translate(550, 175)">
                <rect x="0" y="-20" width="172" height="36" rx="7" fill="#0a0a0a"/>
                <text x="13" y="3"  font-family="Inter, sans-serif" font-size="11.5" font-weight="800" fill="#FB923C" letter-spacing="1.6">SERIES B WALL</text>
                <line x1="0" y1="9" x2="172" y2="9" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
                <text x="13" y="23" font-family="Inter, sans-serif" font-size="10" font-weight="500" fill="#ECE5D3">Where new tools stop scaling</text>
              </g>

              <!-- ============ Survive line (Established CRMs) ============
                   Smooth curve from Seed (130, 745) to IPO (940, 145) -->
              <path d="M 130 745 Q 230 690 332 580 T 535 350 T 737 200 L 940 145 L 940 760 L 130 760 Z"
                    fill="url(#survive-fill)" stroke="none"/>
              <path d="M 130 745 Q 230 690 332 580 T 535 350 T 737 200 L 940 145"
                    stroke="#4F46E5" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

              <g>
                <circle cx="130" cy="745" r="6" fill="#4F46E5" stroke="#fff" stroke-width="2.5"/>
                <circle cx="332" cy="580" r="6" fill="#4F46E5" stroke="#fff" stroke-width="2.5"/>
                <circle cx="535" cy="350" r="6" fill="#4F46E5" stroke="#fff" stroke-width="2.5"/>
                <circle cx="737" cy="200" r="6" fill="#4F46E5" stroke="#fff" stroke-width="2.5"/>
                <circle cx="940" cy="145" r="7" fill="#4F46E5" stroke="#fff" stroke-width="2.5"/>
              </g>

              <!-- ============ Fail line (AI-first CRMs) ============
                   Rises through Seed and Series A, hits the wall at Series B -->
              <path d="M 130 745 Q 230 705 332 615 T 525 475"
                    stroke="#B45309" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M 545 475 L 940 475"
                    stroke="#B45309" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="3 8" opacity="0.45"/>

              <g>
                <circle cx="130" cy="745" r="6" fill="#B45309" stroke="#fff" stroke-width="2.5"/>
                <circle cx="332" cy="615" r="6" fill="#B45309" stroke="#fff" stroke-width="2.5"/>
                <circle cx="525" cy="475" r="9" fill="#B45309" stroke="#fff" stroke-width="3"/>
                <g transform="translate(525, 475)" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
                  <line x1="-4" y1="-4" x2="4" y2="4"/>
                  <line x1="-4" y1="4"  x2="4" y2="-4"/>
                </g>
              </g>

              <!-- ============ Tool logo clusters at endpoints ============ -->

              <!-- AI-first cluster (the "stops here" cluster, below the crash point) -->
              <g transform="translate(415, 495)">
                <rect x="0" y="0" width="110" height="64" rx="9" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
                <text x="55" y="16" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="#B45309" letter-spacing="1.4">STOPS HERE</text>
                <image href="assets/logos/attio-icon.png" x="16" y="26" width="30" height="30"/>
                <image href="assets/logos/folk-icon.png"  x="64" y="26" width="30" height="30"/>
              </g>

              <!-- Established cluster (the "scales to IPO" cluster, near the apex) -->
              <g transform="translate(800, 70)">
                <rect x="0" y="0" width="138" height="74" rx="9" fill="#FFFFFF" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>
                <text x="69" y="17" text-anchor="middle" font-family="Inter, sans-serif" font-size="9.5" font-weight="800" fill="#4F46E5" letter-spacing="1.4">SCALES TO IPO</text>
                <image href="assets/logos/salesforce-icon.png" x="20" y="28" width="36" height="36"/>
                <image href="assets/logos/hubspot-icon.png"    x="82" y="28" width="36" height="36"/>
              </g>

              <!-- ============ X-axis ticks + stage labels ============ -->
              <g font-family="Inter, sans-serif">
                <line x1="130" y1="760" x2="130" y2="770" stroke="#6e685e" stroke-width="1"/>
                <line x1="332" y1="760" x2="332" y2="770" stroke="#6e685e" stroke-width="1"/>
                <line x1="535" y1="760" x2="535" y2="770" stroke="#FB923C" stroke-width="2.5"/>
                <line x1="737" y1="760" x2="737" y2="770" stroke="#6e685e" stroke-width="1"/>
                <line x1="940" y1="760" x2="940" y2="770" stroke="#6e685e" stroke-width="1"/>

                <g font-size="14" font-weight="700" fill="#0a0a0a" text-anchor="middle">
                  <text x="130" y="792">Seed</text>
                  <text x="332" y="792">Series A</text>
                  <text x="535" y="792" fill="#B45309">Series B</text>
                  <text x="737" y="792">Series C</text>
                  <text x="940" y="792">IPO</text>
                </g>

                <g font-size="11" font-weight="500" fill="#9c958a" text-anchor="middle">
                  <text x="130" y="810">~$0-2M ARR</text>
                  <text x="332" y="810">~$2-10M</text>
                  <text x="535" y="810" fill="#B45309" font-weight="700">~$10-30M ARR</text>
                  <text x="737" y="810">~$30-100M</text>
                  <text x="940" y="810">$100M+</text>
                </g>
              </g>

              <text x="130" y="840" font-family="Inter, sans-serif" font-size="11" font-weight="800" fill="#9c958a" letter-spacing="2">COMPANY STAGE →</text>

              <!-- Inline legend below the X-axis, centered -->
              <g transform="translate(316, 868)" font-family="Inter, sans-serif">
                <line x1="0"  y1="0" x2="24" y2="0" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
                <circle cx="12" cy="0" r="4" fill="#4F46E5" stroke="#fff" stroke-width="1.5"/>
                <text x="32" y="4" font-size="12.5" font-weight="700" fill="#0a0a0a">Established CRMs</text>

                <text x="172" y="4" font-size="13" fill="#9c958a">·</text>

                <line x1="184" y1="0" x2="208" y2="0" stroke="#B45309" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 3"/>
                <circle cx="196" cy="0" r="4" fill="#B45309" stroke="#fff" stroke-width="1.5"/>
                <text x="216" y="4" font-size="12.5" font-weight="700" fill="#0a0a0a">AI-first CRMs</text>
              </g>

            </svg>
          </div>

          <!-- Footer -->
          <div class="footer-rule"></div>
          <div class="footer">
            <div class="author">
              <span class="author-dot"></span>
              <span>Patrick Spychalski</span>
            </div>
            <span class="url">thekiln.com</span>
          </div>

        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
