<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Kiln — Statement Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@400..700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- Gradient variants (from colors-exploration.json) ----
     Swap the two --gradient-* values to change variant.
     - orange_indigo   : #FB923C → #818CF8
     - teal_amber      : #0F766E → #F59E0B
     - fuchsia_blue    : #E879F9 → #3B82F6
     - indigo_slate    : #A5B4FC → #64748B
     - rose_violet     : #FB7185 → #A78BFA
  */
  :root {
    --gradient-from: #FB923C;
    --gradient-to: #818CF8;
    --ink: #000000;
    --cream: #F5F4EB;
    --white: #FFFFFF;
    --border-width: 80px;
    --inner-padding: 80px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: #111;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    font-family: 'Inter', sans-serif;
  }

  .card {
    width: 1200px;
    height: 1200px;
    position: relative;
    background: linear-gradient(90deg, var(--gradient-from) 0%, var(--gradient-to) 100%);
    padding: var(--border-width);
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url('../../brand/assets/exploration/texture-topographic.png');
    background-size: 50% 50%;
    background-repeat: repeat;
    mix-blend-mode: multiply;
    opacity: 0.55;
    pointer-events: none;
    z-index: 1;
  }

  .inner {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--white);
  }

  .top-panel {
    flex: 0 0 58%;
    background: var(--white);
    padding: var(--inner-padding);
    position: relative;
  }

  .bottom-panel {
    flex: 1;
    background: var(--cream);
    padding: var(--inner-padding);
    position: relative;
  }

  .logo {
    display: flex;
    align-items: center;
    margin-bottom: 56px;
  }

  .logo-lockup {
    height: 56px;
    width: auto;
    display: block;
  }

  h1 {
    font-family: 'Lora', serif;
    font-weight: 500;
    font-size: 92px;
    line-height: 1.08;
    color: var(--ink);
    letter-spacing: -0.015em;
    max-width: 100%;
  }

  h1 em {
    font-style: italic;
    font-weight: 500;
  }

  /* Doodle accent — top panel bottom-right */
  .accent-top {
    position: absolute;
    right: var(--inner-padding);
    bottom: calc(var(--inner-padding) * 0.5);
    width: 150px;
    height: auto;
  }

  /* Doodle accent — bottom panel bottom-left */
  .accent-bottom {
    position: absolute;
    left: var(--inner-padding);
    bottom: var(--inner-padding);
    width: 110px;
    height: auto;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="top-panel">
        <div class="logo">
          <img class="logo-lockup" src="../../brand/assets/exploration/logos/kiln-lockup-black.png" alt="The Kiln">
        </div>

        <h1>Email deliverability, <em>optimization</em></h1>

        <img class="accent-top" src="../../brand/assets/exploration/doodles/paper-airplane.png" alt="">
      </div>

      <div class="bottom-panel">
        <img class="accent-bottom" src="../../brand/assets/exploration/doodles/curl-cluster.png" alt="">
      </div>
    </div>
  </div>
</body>
</html>
