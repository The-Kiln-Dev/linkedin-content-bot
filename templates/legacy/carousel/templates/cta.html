<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kiln Carousel — CTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  .cta-stack {
    position: absolute;
    left: var(--pad-x);
    right: var(--pad-x);
    top: 50%;
    transform: translateY(-50%);
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }
  .cta-stack .hero-headline {
    text-align: center;
    font-size: 76px;
    max-width: 820px;
  }
  .cta-stack .cta-pill { align-self: center; margin-top: 16px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="top-bar">
      <img class="logo-lockup" src="{{asset_logo_lockup}}" alt="The Kiln">
      <div class="author-badge">
        <span class="name">Patrick</span>
        <img src="{{asset_author_photo}}" alt="Patrick">
      </div>
    </div>

    <div class="cta-stack">
      <div class="category">{{category}}</div>
      <h1 class="hero-headline">{{headline}}</h1>
      <div class="cta-pill">{{cta_text}}</div>
    </div>

    {{doodle_left_block}}
    {{doodle_right_block}}
  </div>
</body>
</html>
